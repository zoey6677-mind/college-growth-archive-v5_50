<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f472b6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="成长档案" />
  <title>成长档案 · 大学生成长记录</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/charts.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-inner">
        <div class="title-block">
          <h1 id="pageTitle">概览</h1>
          <p id="pageSub" class="subtitle">我的大学成长足迹</p>
        </div>
        <button id="yearSwitchBtn" class="year-pill" type="button">
          <span id="yearSwitchLabel">全部学年</span>
          <span class="caret">▾</span>
        </button>
      </div>
    </header>

    <main class="app-main">
      <section id="view-overview" class="view active"></section>
      <section id="view-experiences" class="view"></section>
      <section id="view-stats" class="view"></section>
      <section id="view-timeline" class="view"></section>
      <section id="view-profile" class="view"></section>
    </main>

    <button id="fab" class="fab" type="button" aria-label="添加">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      </svg>
    </button>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-view="overview" type="button">
        <span class="nav-ico">📊</span><span class="nav-txt">概览</span>
      </button>
      <button class="nav-btn" data-view="experiences" type="button">
        <span class="nav-ico">📚</span><span class="nav-txt">经历</span>
      </button>
      <button class="nav-btn" data-view="stats" type="button">
        <span class="nav-ico">📈</span><span class="nav-txt">统计</span>
      </button>
      <button class="nav-btn" data-view="timeline" type="button">
        <span class="nav-ico">🕐</span><span class="nav-txt">时间轴</span>
      </button>
      <button class="nav-btn" data-view="profile" type="button">
        <span class="nav-ico">👤</span><span class="nav-txt">我的</span>
      </button>
    </nav>

    <!-- 通用弹层 -->
    <div id="sheet" class="sheet-mask hidden">
      <div class="sheet-panel" id="sheetPanel">
        <div class="sheet-grip"></div>
        <div class="sheet-head">
          <h2 id="sheetTitle">标题</h2>
          <button class="sheet-close" id="sheetClose" type="button">✕</button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
